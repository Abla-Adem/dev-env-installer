---
# Parité complète avec bash/install.sh — voir README.md de ce dossier pour
# la table de correspondance flags bash <-> variables Ansible.
#
# Lancer :
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.ini playbook.yml --ask-become-pass

- name: Provisionner un poste de dev (parité avec bash/install.sh)
  hosts: local
  become: true

  pre_tasks:
    - name: Traduire les flags de haut niveau en skip_* (équivalent du parsing d'arguments bash)
      ansible.builtin.set_fact:
        skip_install: "{{ ssh_only or vault_only or cloud_only or extras_only }}"
        skip_ssh: "{{ cloud_only or extras_only }}"
        skip_cloud: "{{ ssh_only or vault_only or extras_only or no_cloud }}"
        skip_vault: "{{ ssh_only or cloud_only or extras_only or no_vault }}"

    - name: Déterminer le style d'architecture (équivalent du $ARCH bash)
      ansible.builtin.set_fact:
        arch_amd64_style: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"
        arch_x86_64_style: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}"

    - name: Système détecté (équivalent de detect_pkg_manager())
      ansible.builtin.debug:
        msg: "OS={{ ansible_facts['os_family'] }} arch={{ ansible_facts['architecture'] }} skip_install={{ skip_install }} skip_ssh={{ skip_ssh }} skip_cloud={{ skip_cloud }} skip_vault={{ skip_vault }} extras_only={{ extras_only }}"

  tasks:
    # -----------------------------------------------------------------
    # Équivalent de : if EXTRAS_ONLY == true; then run_extras_only; return; fi
    # -----------------------------------------------------------------
    - name: Mode --extras-only
      when: extras_only | bool
      block:
        - name: Homebrew (macOS, requis avant tout le reste)
          ansible.builtin.include_tasks: tasks/ensure_brew.yml
          when: ansible_facts['os_family'] == "Darwin"

        - ansible.builtin.include_tasks: tasks/extras_only.yml

    # -----------------------------------------------------------------
    # Équivalent de : if SKIP_INSTALL == false; then ... fi
    # -----------------------------------------------------------------
    - name: Installation des outils
      when: not (skip_install | bool)
      block:
        - name: Homebrew (macOS)
          ansible.builtin.include_tasks: tasks/ensure_brew.yml
          when: ansible_facts['os_family'] == "Darwin"

        - ansible.builtin.include_tasks: tasks/vscode.yml
        - ansible.builtin.include_tasks: tasks/obsidian.yml
        - ansible.builtin.include_tasks: tasks/terraform.yml
        - ansible.builtin.include_tasks: tasks/awscli.yml
        - ansible.builtin.include_tasks: tasks/aws_sdk.yml
        - ansible.builtin.include_tasks: tasks/gcloud.yml
        - ansible.builtin.include_tasks: tasks/gcp_sdk.yml
        - ansible.builtin.include_tasks: tasks/docker.yml
        - ansible.builtin.include_tasks: tasks/kubectl.yml
        - ansible.builtin.include_tasks: tasks/helm.yml
        - ansible.builtin.include_tasks: tasks/jq.yml
        - ansible.builtin.include_tasks: tasks/claude_code.yml

        - name: Outils optionnels (--with-extras)
          ansible.builtin.include_tasks: tasks/optional_tool_install.yml
          loop: "{{ optional_tools }}"
          loop_control:
            loop_var: tool
          vars:
            tool_name: "{{ tool.name }}"
          when: with_extras | bool

    # -----------------------------------------------------------------
    # Équivalent de : if SKIP_SSH == false; then generate_ssh_key; configure_git_identity; fi
    # -----------------------------------------------------------------
    - name: Clé SSH et identité git
      when: not (skip_ssh | bool)
      block:
        - ansible.builtin.include_tasks: tasks/ssh_key.yml
        - ansible.builtin.include_tasks: tasks/git_identity.yml

    # -----------------------------------------------------------------
    # Équivalent de : if SKIP_CLOUD == false; then configure_aws; configure_gcp; fi
    # -----------------------------------------------------------------
    - name: Configuration AWS / GCP
      when: not (skip_cloud | bool)
      block:
        - ansible.builtin.include_tasks: tasks/cloud_aws.yml
        - ansible.builtin.include_tasks: tasks/cloud_gcp.yml

    # -----------------------------------------------------------------
    # Équivalent de : if SKIP_VAULT == false; then setup_obsidian_vault; fi
    # -----------------------------------------------------------------
    - name: Coffre-fort Obsidian
      ansible.builtin.include_tasks: tasks/vault.yml
      when: not (skip_vault | bool)

    # -----------------------------------------------------------------
    # Équivalent de : if SKIP_INSTALL == false; then print_optional_tools_summary; fi
    # -----------------------------------------------------------------
    - name: Résumé des outils optionnels manquants
      ansible.builtin.include_tasks: tasks/optional_tools_summary.yml
      when: not (skip_install | bool)
