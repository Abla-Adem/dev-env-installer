---
# Équivalent de install_obsidian() dans bash/install.sh
- name: Vérifier si Obsidian est déjà installé
  ansible.builtin.command: which obsidian
  register: obsidian_check
  changed_when: false
  failed_when: false
  become: false

- name: Installer Obsidian
  when: obsidian_check.rc != 0
  block:
    - name: "macOS: Obsidian via Homebrew Cask"
      community.general.homebrew_cask:
        name: obsidian
        state: present
      become: false
      when: ansible_facts['os_family'] == "Darwin"

    - name: "Linux: détecter snap/flatpak disponibles"
      ansible.builtin.command: "which {{ item }}"
      register: obsidian_pkg_managers
      changed_when: false
      failed_when: false
      loop: [snap, flatpak]
      when: ansible_facts['os_family'] != "Darwin"

    - name: "Linux avec snap: installer Obsidian"
      community.general.snap:
        name: obsidian
        classic: true
      when:
        - ansible_facts['os_family'] != "Darwin"
        - obsidian_pkg_managers.results[0].rc == 0

    - name: "Linux avec flatpak (pas de snap): installer Obsidian"
      community.general.flatpak:
        name: md.obsidian.Obsidian
        remote: flathub
        state: present
      when:
        - ansible_facts['os_family'] != "Darwin"
        - obsidian_pkg_managers.results[0].rc != 0
        - obsidian_pkg_managers.results[1].rc == 0

    # /releases/latest peut pointer sur une release mobile-only (.apk seul,
    # sans .deb/.rpm — vérifié en conditions réelles). On cherche donc dans
    # les releases récentes (déjà triées du plus récent au plus ancien par
    # l'API GitHub) plutôt que sur la seule "latest".
    - name: "Linux sans snap/flatpak: récupérer les releases récentes GitHub"
      ansible.builtin.uri:
        url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=10
        return_content: true
      register: obsidian_releases
      when:
        - ansible_facts['os_family'] != "Darwin"
        - obsidian_pkg_managers.results[0].rc != 0
        - obsidian_pkg_managers.results[1].rc != 0

    - name: "Debian/Ubuntu sans snap/flatpak: télécharger et installer le .deb"
      when:
        - ansible_facts['os_family'] == "Debian"
        - obsidian_pkg_managers.results[0].rc != 0
        - obsidian_pkg_managers.results[1].rc != 0
      vars:
        deb_asset: "{{ (obsidian_releases.json | map(attribute='assets') | flatten | selectattr('name', 'search', '\\.deb$') | map(attribute='browser_download_url') | list)[0] }}"
      ansible.builtin.apt:
        deb: "{{ deb_asset }}"

    - name: "Fedora/RHEL sans flatpak: télécharger et installer le .rpm"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - obsidian_pkg_managers.results[1].rc != 0
      vars:
        rpm_asset: "{{ (obsidian_releases.json | map(attribute='assets') | flatten | selectattr('name', 'search', '\\.rpm$') | map(attribute='browser_download_url') | list)[0] }}"
      ansible.builtin.dnf:
        name: "{{ rpm_asset }}"
        state: present
        disable_gpg_check: true

    - name: "Arch sans flatpak: avertissement AUR"
      ansible.builtin.debug:
        msg: "Installe flatpak ou un helper AUR (yay/paru) pour Obsidian — non géré automatiquement par ce playbook."
      when:
        - ansible_facts['os_family'] == "Archlinux"
        - obsidian_pkg_managers.results[1].rc != 0
